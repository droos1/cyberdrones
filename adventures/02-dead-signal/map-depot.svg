<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a2a3a" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Guard icon -->
    <symbol id="guard" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5" fill="#ff6b35" stroke="#fff" stroke-width="1.5"/>
      <path d="M6 22 L6 16 A6 6 0 0 1 18 16 L18 22" fill="#ff6b35" stroke="#fff" stroke-width="1.5"/>
    </symbol>
    <!-- Dog icon -->
    <symbol id="dog" viewBox="0 0 28 20">
      <ellipse cx="14" cy="12" rx="9" ry="6" fill="#ff6b35" stroke="#fff" stroke-width="1.2"/>
      <circle cx="22" cy="8" r="3.5" fill="#ff6b35" stroke="#fff" stroke-width="1.2"/>
      <circle cx="23.5" cy="7" r="1" fill="#fff"/>
    </symbol>
    <!-- Camera icon -->
    <symbol id="camera" viewBox="0 0 20 16">
      <rect x="2" y="4" width="16" height="10" rx="2" fill="#ffd166" stroke="#fff" stroke-width="1"/>
      <circle cx="10" cy="9" r="3" fill="#fff" opacity="0.6"/>
    </symbol>
    <!-- Target marker -->
    <symbol id="target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#e63946" stroke-width="2"/>
      <circle cx="12" cy="12" r="5" fill="none" stroke="#e63946" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="1.5" fill="#e63946"/>
      <line x1="12" y1="0" x2="12" y2="5" stroke="#e63946" stroke-width="1.5"/>
      <line x1="12" y1="19" x2="12" y2="24" stroke="#e63946" stroke-width="1.5"/>
      <line x1="0" y1="12" x2="5" y2="12" stroke="#e63946" stroke-width="1.5"/>
      <line x1="19" y1="12" x2="24" y2="12" stroke="#e63946" stroke-width="1.5"/>
    </symbol>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#0d1b2a"/>
  <rect x="40" y="80" width="820" height="600" fill="#132238" rx="4"/>
  <rect x="40" y="80" width="820" height="600" fill="url(#grid)" rx="4"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#e63946" font-size="22" font-weight="700" letter-spacing="3">NORTHSIDE TRAUMA TEAM MEDICAL DEPOT</text>
  <text x="450" y="68" text-anchor="middle" fill="#8899aa" font-size="12" letter-spacing="2">TACTICAL OVERVIEW — PART 5: THE DEPOT JOB</text>

  <!-- === BUILDING OUTLINE === -->
  <rect x="120" y="120" width="660" height="520" fill="none" stroke="#3a5a7a" stroke-width="2.5" rx="3"/>

  <!-- Loading Dock (top) -->
  <rect x="120" y="120" width="660" height="140" fill="#1a2d44" stroke="#3a5a7a" stroke-width="1.5"/>
  <text x="450" y="155" text-anchor="middle" fill="#5a8aaa" font-size="15" font-weight="600" letter-spacing="2">LOADING DOCK</text>
  <text x="450" y="175" text-anchor="middle" fill="#4a6a7a" font-size="10" letter-spacing="1">EXTERIOR — PATROL ZONE</text>

  <!-- Loading dock doors -->
  <rect x="220" y="118" width="60" height="8" fill="#2a4a6a" stroke="#5a8aaa" stroke-width="1" rx="1"/>
  <rect x="420" y="118" width="60" height="8" fill="#2a4a6a" stroke="#5a8aaa" stroke-width="1" rx="1"/>
  <rect x="620" y="118" width="60" height="8" fill="#2a4a6a" stroke="#5a8aaa" stroke-width="1" rx="1"/>
  <text x="250" y="113" text-anchor="middle" fill="#4a6a7a" font-size="8">ROLL DOOR</text>
  <text x="450" y="113" text-anchor="middle" fill="#4a6a7a" font-size="8">ROLL DOOR</text>
  <text x="650" y="113" text-anchor="middle" fill="#4a6a7a" font-size="8">ROLL DOOR</text>

  <!-- Keycard entry door -->
  <rect x="155" y="195" width="6" height="30" fill="#06d6a0" stroke="#fff" stroke-width="0.5" rx="1" filter="url(#glow)"/>
  <text x="110" y="215" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="600">KEYCARD</text>
  <text x="110" y="226" text-anchor="middle" fill="#06d6a0" font-size="9" font-weight="600">ENTRY</text>

  <!-- Divider line between dock and interior -->
  <line x1="120" y1="260" x2="780" y2="260" stroke="#3a5a7a" stroke-width="2"/>
  <!-- Interior door from dock -->
  <rect x="350" y="255" width="50" height="10" fill="#1a2d44" stroke="#5a8aaa" stroke-width="1"/>
  <text x="375" y="252" text-anchor="middle" fill="#5a8aaa" font-size="8">DOOR</text>

  <!-- === STORAGE BAYS === -->

  <!-- Bay A - Drugs Vault -->
  <rect x="120" y="260" width="200" height="220" fill="#1e1028" stroke="#3a5a7a" stroke-width="1.5"/>
  <rect x="130" y="270" width="180" height="200" fill="none" stroke="#9b59b6" stroke-width="1" stroke-dasharray="4,3" rx="2"/>
  <text x="220" y="300" text-anchor="middle" fill="#9b59b6" font-size="16" font-weight="700" letter-spacing="2">BAY A</text>
  <text x="220" y="320" text-anchor="middle" fill="#9b59b6" font-size="11">PHARMACEUTICALS</text>
  <text x="220" y="340" text-anchor="middle" fill="#e63946" font-size="10" font-weight="700">VAULT — DO NOT TOUCH</text>
  <text x="220" y="360" text-anchor="middle" fill="#e63946" font-size="9">50,000+ EB value</text>
  <text x="220" y="380" text-anchor="middle" fill="#e63946" font-size="9">Triggers TT vendetta</text>
  <!-- Vault door icon -->
  <rect x="295" y="340" width="8" height="40" fill="#9b59b6" stroke="#fff" stroke-width="0.5" rx="1"/>

  <!-- Bay B - General Medical -->
  <rect x="320" y="260" width="240" height="220" fill="#162a3a" stroke="#3a5a7a" stroke-width="1.5"/>
  <text x="440" y="300" text-anchor="middle" fill="#5a8aaa" font-size="16" font-weight="700" letter-spacing="2">BAY B</text>
  <text x="440" y="320" text-anchor="middle" fill="#5a8aaa" font-size="11">GENERAL MEDICAL SUPPLIES</text>
  <!-- Shelving rows -->
  <rect x="340" y="340" width="200" height="6" fill="#2a4a6a" rx="1"/>
  <rect x="340" y="365" width="200" height="6" fill="#2a4a6a" rx="1"/>
  <rect x="340" y="390" width="200" height="6" fill="#2a4a6a" rx="1"/>
  <rect x="340" y="415" width="200" height="6" fill="#2a4a6a" rx="1"/>
  <rect x="340" y="440" width="200" height="6" fill="#2a4a6a" rx="1"/>
  <text x="440" y="468" text-anchor="middle" fill="#3a5a6a" font-size="8">SHELVING ROWS</text>
  <!-- Door to Bay B from dock -->
  <rect x="400" y="255" width="40" height="10" fill="#162a3a"/>

  <!-- Bay C - SURGICAL — TARGET -->
  <rect x="560" y="260" width="220" height="220" fill="#1a0d0d" stroke="#e63946" stroke-width="2"/>
  <rect x="570" y="270" width="200" height="200" fill="none" stroke="#e63946" stroke-width="1" stroke-dasharray="5,3" rx="2"/>
  <text x="670" y="300" text-anchor="middle" fill="#e63946" font-size="16" font-weight="700" letter-spacing="2">BAY C</text>
  <text x="670" y="320" text-anchor="middle" fill="#e63946" font-size="11">SURGICAL TOOLS</text>
  <text x="670" y="345" text-anchor="middle" fill="#e63946" font-size="10" font-weight="600">LOCKED — TECH DV 15</text>
  <text x="670" y="362" text-anchor="middle" fill="#e63946" font-size="10">or PICK LOCK DV 13</text>
  <!-- Target marker on the cabinet -->
  <use href="#target" x="645" y="385" width="28" height="28"/>
  <text x="670" y="430" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">NEURAL BRIDGE</text>
  <text x="670" y="444" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">DECOUPLER</text>
  <!-- Locked door indicator -->
  <rect x="558" y="340" width="6" height="35" fill="#e63946" stroke="#fff" stroke-width="0.5" rx="1"/>
  <text x="548" y="355" text-anchor="end" fill="#e63946" font-size="8" font-weight="600">LOCKED</text>

  <!-- === BOTTOM SECTION === -->

  <!-- Monitoring Station -->
  <rect x="120" y="480" width="300" height="160" fill="#1a2838" stroke="#3a5a7a" stroke-width="1.5"/>
  <text x="270" y="510" text-anchor="middle" fill="#ffd166" font-size="15" font-weight="700" letter-spacing="2">MONITORING STATION</text>
  <!-- Desk / console -->
  <rect x="180" y="530" width="180" height="30" fill="#2a3a4a" stroke="#ffd166" stroke-width="1" rx="2"/>
  <text x="270" y="550" text-anchor="middle" fill="#ffd166" font-size="9">CAMERA FEEDS / ALERT BUTTON</text>
  <!-- Monitor screens -->
  <rect x="195" y="535" width="20" height="14" fill="#0a1520" stroke="#ffd166" stroke-width="0.5" rx="1"/>
  <rect x="225" y="535" width="20" height="14" fill="#0a1520" stroke="#ffd166" stroke-width="0.5" rx="1"/>
  <rect x="255" y="535" width="20" height="14" fill="#0a1520" stroke="#ffd166" stroke-width="0.5" rx="1"/>
  <rect x="285" y="535" width="20" height="14" fill="#0a1520" stroke="#ffd166" stroke-width="0.5" rx="1"/>
  <rect x="315" y="535" width="20" height="14" fill="#0a1520" stroke="#ffd166" stroke-width="0.5" rx="1"/>

  <!-- Staff Area -->
  <rect x="420" y="480" width="360" height="160" fill="#1a2535" stroke="#3a5a7a" stroke-width="1.5"/>
  <text x="600" y="510" text-anchor="middle" fill="#5a8aaa" font-size="15" font-weight="700" letter-spacing="2">STAFF AREA</text>
  <text x="600" y="530" text-anchor="middle" fill="#4a6a7a" font-size="10">Break Room / Lockers</text>
  <!-- Table -->
  <rect x="520" y="550" width="80" height="40" fill="#2a3a4a" stroke="#3a5a6a" stroke-width="1" rx="2"/>
  <text x="560" y="574" text-anchor="middle" fill="#3a5a6a" font-size="8">TABLE</text>
  <!-- Lockers -->
  <rect x="660" y="545" width="60" height="50" fill="#2a3a4a" stroke="#3a5a6a" stroke-width="1" rx="1"/>
  <text x="690" y="574" text-anchor="middle" fill="#3a5a6a" font-size="8">LOCKERS</text>
  <!-- Food for dogs hint -->
  <rect x="440" y="570" width="50" height="25" fill="#2a3a4a" stroke="#06d6a0" stroke-width="1" stroke-dasharray="3,2" rx="2"/>
  <text x="465" y="586" text-anchor="middle" fill="#06d6a0" font-size="7">FOOD</text>

  <!-- Wall between monitoring and staff -->
  <line x1="420" y1="480" x2="420" y2="640" stroke="#3a5a7a" stroke-width="1.5"/>
  <!-- Door between them -->
  <rect x="415" y="540" width="10" height="30" fill="#1a2535" stroke="#5a8aaa" stroke-width="0.5"/>

  <!-- === GUARDS === -->
  <!-- Exterior patrol guards -->
  <use href="#guard" x="180" y="168" width="22" height="22"/>
  <text x="191" y="200" text-anchor="middle" fill="#ff6b35" font-size="9" font-weight="600">PATROL 1</text>

  <use href="#guard" x="660" y="168" width="22" height="22"/>
  <text x="671" y="200" text-anchor="middle" fill="#ff6b35" font-size="9" font-weight="600">PATROL 2</text>

  <!-- Patrol route arrows -->
  <line x1="210" y1="180" x2="650" y2="180" stroke="#ff6b35" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
  <polygon points="648,176 658,180 648,184" fill="#ff6b35" opacity="0.5"/>

  <!-- Interior guards at monitoring station -->
  <use href="#guard" x="210" y="580" width="22" height="22"/>
  <text x="221" y="614" text-anchor="middle" fill="#ff6b35" font-size="9" font-weight="600">GUARD 3</text>
  <use href="#guard" x="300" y="580" width="22" height="22"/>
  <text x="311" y="614" text-anchor="middle" fill="#ff6b35" font-size="9" font-weight="600">GUARD 4</text>

  <!-- Guard dogs -->
  <use href="#dog" x="440" y="350" width="24" height="18"/>
  <text x="452" y="380" text-anchor="middle" fill="#ff6b35" font-size="8">DOGS (random patrol)</text>
  <!-- Dog patrol route -->
  <path d="M 452 345 L 452 290 L 600 290 L 600 460 L 300 460 L 300 345" fill="none" stroke="#ff6b35" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Cameras -->
  <use href="#camera" x="140" y="265" width="16" height="14"/>
  <use href="#camera" x="540" y="265" width="16" height="14"/>
  <use href="#camera" x="345" y="476" width="16" height="14"/>

  <!-- Motion sensors -->
  <circle cx="350" cy="310" r="5" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="350" cy="310" r="12" fill="none" stroke="#ffd166" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="350" y="332" text-anchor="middle" fill="#ffd166" font-size="7">MOTION</text>

  <circle cx="550" cy="370" r="5" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="550" cy="370" r="12" fill="none" stroke="#ffd166" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="550" y="392" text-anchor="middle" fill="#ffd166" font-size="7">MOTION</text>

  <!-- === LEGEND === -->
  <rect x="40" y="660" width="820" height="50" fill="#0a1520" rx="3"/>

  <use href="#guard" x="60" y="668" width="18" height="18"/>
  <text x="85" y="682" fill="#ff6b35" font-size="10">Guards (HP 35, SP 11)</text>

  <use href="#camera" x="230" y="670" width="14" height="12"/>
  <text x="250" y="682" fill="#ffd166" font-size="10">Camera</text>

  <circle cx="325" cy="678" r="4" fill="none" stroke="#ffd166" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="335" y="682" fill="#ffd166" font-size="10">Motion Sensor</text>

  <use href="#target" x="440" y="666" width="16" height="16"/>
  <text x="462" y="682" fill="#e63946" font-size="10" font-weight="600">Objective</text>

  <rect x="540" y="672" width="12" height="8" fill="#06d6a0" rx="1"/>
  <text x="558" y="682" fill="#06d6a0" font-size="10">Keycard Access</text>

  <text x="700" y="682" fill="#4a6a7a" font-size="10">Shift change: 02:00 (5 min window)</text>

  <text x="450" y="705" text-anchor="middle" fill="#4a6a7a" font-size="9">AV RESPONSE: 4 MINUTES IF ALERT TRIGGERED</text>
</svg>